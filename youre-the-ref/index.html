<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're the Ref</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--night:#0d1712;--panel:#14221a;--line:#2a4234;--chalk:#f3f5ef;--muted:#9fb0a5;--yellow:#f4c430;--red:#e0453f;--green:#2fa866;--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:Barlow,system-ui,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--night);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.45}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:10px}
  header>div:first-child{white-space:nowrap}
  .logo{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase;color:var(--yellow)}
  .sub{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .dots{display:flex;gap:6px}
  .dot{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.4px;padding:4px 7px;border-radius:7px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
  .dot.now{border-color:var(--yellow);color:var(--chalk)} .dot.ok{background:var(--green);border-color:var(--green);color:#fff} .dot.no{background:var(--red);border-color:var(--red);color:#fff}
  .stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
  canvas{display:block;width:100%;height:auto}
  .ghost{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.66);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.5px;text-transform:uppercase;color:var(--chalk);cursor:pointer}
  .more{display:block;text-align:center;margin:18px 0 0;color:var(--muted);font-size:14px} .more a{color:var(--yellow);font-weight:600}
  .cap{min-height:52px;margin:12px 2px 10px;font-size:18px;font-weight:600;text-wrap:balance}
  .cap.q{color:var(--yellow)}
  .calls{display:grid;gap:8px}
  button{font:inherit;color:inherit;cursor:pointer;border:0}
  .call{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:.5px;text-transform:uppercase;padding:13px 12px;border-radius:12px;background:var(--panel);border:2px solid var(--line);text-align:left}
  .call:hover:not(:disabled){border-color:var(--yellow)} .call:active:not(:disabled){transform:scale(.985)}
  .call:disabled{opacity:.45;cursor:default} .call.right{background:var(--green);border-color:var(--green);opacity:1} .call.wrong{background:var(--red);border-color:var(--red);opacity:1}
  .call:focus-visible,.primary:focus-visible,.ghost:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .verdict{margin-top:12px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
  .verdict h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:0 0 6px;text-transform:uppercase}
  .verdict p{margin:0 0 8px}
  .law{color:var(--yellow);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.5px;text-transform:uppercase}
  #clip{color:var(--yellow);font-weight:600;text-underline-offset:3px}
  .twist{color:var(--muted);font-size:15px}
  .primary{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.6px;text-transform:uppercase;background:var(--yellow);color:#1a1606;border-radius:12px;padding:13px 18px;width:100%;margin-top:6px}
  .big{font-family:var(--display);font-weight:800;font-size:84px;line-height:.9;font-variant-numeric:tabular-nums}
  .big small{font-size:36px;color:var(--muted)}
  .grid{font-size:30px;letter-spacing:4px;margin:10px 0}
  .muted{color:var(--muted);font-size:14px}
  .rows{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
  .rows li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:15px}
  .rows b{font-family:var(--display);font-size:17px;letter-spacing:.4px;text-transform:uppercase}
  .lb{margin-top:12px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
  .lb h3{font-family:var(--display);font-weight:800;font-size:24px;margin:0 0 8px;text-transform:uppercase;color:var(--yellow)}
  .lbform{display:flex;gap:8px;margin-bottom:10px}
  .lbform input{flex:1;min-width:0;font:inherit;font-weight:600;color:var(--chalk);background:var(--night);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
  .lbform input:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
  .lbform button{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;background:var(--yellow);color:#1a1606;border-radius:10px;padding:0 16px}
  .lbtabs{display:flex;gap:6px;margin-bottom:8px}
  .lbtabs button{font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;padding:5px 10px;border-radius:8px;background:var(--night);border:1px solid var(--line);color:var(--muted)}
  .lbtabs button[aria-pressed=true]{border-color:var(--yellow);color:var(--chalk)}
  .lbl{list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums}
  .lbl li{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;padding:7px 4px;border-top:1px solid var(--line);font-size:15px}
  .lbl li.me{color:var(--yellow);font-weight:700} .lbl .t{color:var(--muted)}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){.call{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="logo">You're the Ref</div><div class="sub" id="sub">Today's calls</div></div>
    <div class="dots" id="dots" aria-label="Progress"></div>
  </header>
  <main id="play">
    <div class="stage"><canvas id="cv" width="720" height="820" role="img" aria-label="Animated diagram of the play"></canvas><button class="ghost" id="again" hidden>Watch again</button></div>
    <p class="cap" id="cap" aria-live="polite"></p>
    <div class="calls" id="calls"></div>
    <div class="verdict" id="verdict" hidden>
      <h2 id="vh"></h2><p id="why"></p><p class="law" id="law"></p><p class="twist" id="twist"></p>
      <p style="margin:0 0 10px"><a id="clip" target="_blank" rel="noopener" hidden></a></p>
      <button class="primary" id="next">Next call</button>
    </div>
  </main>
  <main id="done" hidden>
    <div class="verdict">
      <div class="sub" id="rank"></div>
      <div class="big"><span id="score">0</span><small id="outof">/6</small></div>
      <div class="grid" id="grid" aria-hidden="true"></div>
      <p class="muted" id="streak"></p>
      <ul class="rows" id="rows"></ul>
      <button class="primary" id="copy">Copy my score</button>
      <button class="call" id="review" style="width:100%;margin-top:8px;text-align:center">Play these again</button>
      <p class="muted" style="margin:12px 0 0">Every ruling is checked against the league's official rulebook. Plays are illustrations, not real games. Not affiliated with any league.</p>
    </div>
    <section class="lb" id="lb" aria-labelledby="lbh">
      <h3 id="lbh">Leaderboard</h3>
      <form class="lbform" id="lbform"><input id="lbname" maxlength="16" autocomplete="nickname" placeholder="Your ref name" aria-label="Your ref name"><button type="submit">Post score</button></form>
      <div class="lbtabs"><button type="button" id="lbday" aria-pressed="true">Today</button><button type="button" id="lball" aria-pressed="false">All time</button></div>
      <ol class="lbl" id="lblist"></ol><p class="muted" id="lbmsg" style="margin:8px 0 0"></p>
    </section>
  </main>
  <p class="more"><a href="../">All games</a> · <a href="../call-the-play/">Call the Play</a></p>
</div>
<script src="../engine.js"></script>
<script>
function startGame(DAY,P){
  "use strict";
  var  $=function(i){return document.getElementById(i)};
  var cv=$("cv"), c=cv.getContext("2d"), RECT=[0,0,720,820];
  var LB_URL="https://script.google.com/macros/s/AKfycbzGPdRJZk0vHKk9WJ-I07KCqWVHK5xBLxOFX213AK_PV10CoXijYS2iWLANi5TyNs5X/exec", secs=0, asked=0; var i=0, res=[], raf=0, answered=false, reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
  function dots(){$("dots").innerHTML=P.map(function(p,j){var s=res[j]===undefined?(j===i?"now":""):(res[j]?"ok":"no");return '<span class="dot '+s+'">'+p.league+'</span>'}).join("")}
  function paint(t,trail){YTR.draw(c,P[i],t,RECT,{trail:trail});var lb=P[i].league;c.font="800 24px 'Barlow Condensed', Arial, sans-serif";YTR.chip(c,lb,14+(c.measureText(lb).width+21.6)/2,32,24,"#111","#f4c430",1)}
  function run(slow){
    cancelAnimationFrame(raf);var p=P[i],k=slow?(p.replay?0.8:0.5):0.7,t0=null,lead=slow?0:3600;
    $("again").hidden=true; if(!slow){$("calls").innerHTML="";$("cap").className="cap";$("cap").textContent=p.setup}
    if(reduce){paint(p.dur,true);ask();return}
    function step(now){if(t0===null)t0=now;var t=Math.max(0,(now-t0-lead)/1000)*k;
      if(t>=p.dur){paint(p.dur,true);if(slow)ask();else setTimeout(ask,1800);return}
      paint(t,slow);if(now-t0>=lead&&!answered){$("cap").className="cap";$("cap").textContent=YTR.capAt(p,t)||$("cap").textContent}
      raf=requestAnimationFrame(step)}
    raf=requestAnimationFrame(step)
  }
  function ask(){var p=P[i];$("again").hidden=false;if(answered)return;if(!asked)asked=Date.now();$("cap").className="cap q";$("cap").textContent=p.after;
    if($("calls").children.length)return;
    p.options.forEach(function(o,j){var b=document.createElement("button");b.className="call";b.textContent=o;b.onclick=function(){answer(j)};$("calls").appendChild(b)})}
  function answer(j){if(answered)return;answered=true;secs+=Math.min(60,(Date.now()-(asked||Date.now()))/1000);asked=0;var p=P[i],ok=j===p.answer;res[i]=ok;
    [].forEach.call($("calls").children,function(b,n){b.disabled=true;if(n===p.answer)b.classList.add("right");else if(n===j)b.classList.add("wrong")});
    $("vh").textContent=ok?"Good call":"Wrong call";$("vh").style.color=ok?"var(--green)":"var(--red)";
    $("why").textContent=p.why;$("law").textContent=p.law;$("twist").textContent=p.twist;var a=$("clip");if(p.clip){a.href=p.clip.url;a.textContent=p.clip.label+" ↗";a.hidden=false}else a.hidden=true;$("next").textContent=i===P.length-1?"See my score":"Next call";
    $("verdict").hidden=false;dots();$("next").focus({preventScroll:true})}
  function load(){answered=false;$("verdict").hidden=true;$("sub").textContent="Day "+DAY+"  ·  "+P[i].title;dots();run(false)}
  function grid(){return res.map(function(r){return r?"🟩":"🟥"}).join("")}
  function finish(){
    var n=res.filter(Boolean).length,ranks=["Fan in the cheap seats","Replay booth intern","Line judge","Line judge","Crew chief","Crew chief","Head of officiating"];
    $("play").hidden=true;$("done").hidden=false;$("sub").textContent="Day "+DAY+"  ·  Final";$("score").textContent=n;$("outof").textContent="/"+P.length;$("rank").textContent=ranks[n];$("grid").textContent=grid();
    $("rows").innerHTML=P.map(function(p,j){return "<li><span><b>"+p.league+"</b> · "+p.title+"</span><span>"+p.stamp+" "+(res[j]?"✓":"✗")+"</span></li>"}).join("");
    var s=store("ytr_daily")||{};if(s.last!==DAY){s.streak=(s.last===DAY-1?(s.streak||0):0)+1;s.last=DAY;s.first=n}s.best=Math.max(s.best||0,n);store("ytr_daily",s);
    lbInit(n,s);$("streak").textContent=s.streak?"Streak: "+s.streak+" day"+(s.streak>1?"s":"")+"  ·  Best: "+s.best+"/"+P.length:"";dots()}
  $("again").onclick=function(){run(true)};
  $("next").onclick=function(){if(i===P.length-1){finish();return}i++;load();window.scrollTo({top:0,behavior:reduce?"auto":"smooth"})};
  $("review").onclick=function(){i=0;res=[];secs=0;practice=true;$("done").hidden=true;$("play").hidden=false;load()};
  $("copy").onclick=function(){var t="You're the Ref · Day "+DAY+"\n"+P.map(function(p){return p.league}).join(" ")+"\n"+grid()+"  "+res.filter(Boolean).length+"/"+P.length,b=this;
    function ok(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy my score"},1600)}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,function(){b.textContent=t});else b.textContent=t};
  var practice=false, board=null, tab="day";
  function lbShow(){var rows=board?(tab==="day"?board.day:board.all)||[]:[],me=(store("ytr_name")||"").toLowerCase(),L=$("lblist");L.textContent="";
    rows.forEach(function(r,k){var li=document.createElement("li");if(r.name.toLowerCase()===me)li.className="me";
      [String(k+1),r.name,tab==="day"?r.score+"/"+r.total:r.score+" right",tab==="day"?Math.round(r.secs)+"s":r.days+" day"+(r.days>1?"s":"")].forEach(function(x,m){var s=document.createElement("span");if(m===3)s.className="t";s.textContent=x;li.appendChild(s)});L.appendChild(li)});
    if(!rows.length&&board)$("lbmsg").textContent="No scores yet. Be the first."}
  function lbCall(body){return fetch(LB_URL+(body?"":"?day="+DAY),body?{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)}:{}).then(function(r){return r.json()})}
  function lbInit(n,s){
    if(!LB_URL){$("lbform").hidden=true;$("lbmsg").textContent="The leaderboard isn't switched on yet.";return}
    var posted=s.posted===DAY;$("lbform").hidden=posted||practice;$("lbname").value=store("ytr_name")||"";
    $("lbmsg").textContent=practice&&!posted?"Replays are practice. Only your first run counts.":"Loading scores...";
    lbCall().then(function(b){board=b;$("lbmsg").textContent=practice&&!posted?"Replays are practice. Only your first run counts.":"";lbShow()},function(){$("lbmsg").textContent="Couldn't load the leaderboard. Try again later."});
    $("lbform").onsubmit=function(e){e.preventDefault();var name=$("lbname").value.replace(/[^A-Za-z0-9 _-]/g,"").trim().slice(0,16);
      if(name.length<2){$("lbmsg").textContent="Pick a name with at least 2 letters or numbers.";return}
      $("lbmsg").textContent="Posting...";lbCall({day:DAY,name:name,score:n,total:P.length,secs:Math.round(secs*10)/10}).then(function(b){
        if(b.error){$("lbmsg").textContent=b.error;return}board=b;store("ytr_name",name);var z=store("ytr_daily")||{};z.posted=DAY;store("ytr_daily",z);$("lbform").hidden=true;$("lbmsg").textContent="Posted.";lbShow()},function(){$("lbmsg").textContent="Couldn't post your score. Try again."})}}
  $("lbday").onclick=function(){tab="day";this.setAttribute("aria-pressed","true");$("lball").setAttribute("aria-pressed","false");lbShow()};
  $("lball").onclick=function(){tab="all";this.setAttribute("aria-pressed","true");$("lbday").setAttribute("aria-pressed","false");lbShow()};
  window.__ytr={answer:answer,state:function(){return {i:i,res:res,answered:answered}},skip:function(){cancelAnimationFrame(raf);paint(P[i].dur,true);ask()}};
  load();
}
(function(){
  /* Day 2 was 19 Nov 2026 (US Eastern). A new slate goes live at midnight Eastern if slates/day-N.js exists; otherwise the latest one stays up. */
  function todayN(){try{var s=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()).split("-");
    return 2+Math.round((Date.UTC(+s[0],+s[1]-1,+s[2])-Date.UTC(2026,10,19))/864e5)}catch(e){return 2}}
  function tryDay(n,left){if(n<1||left<0){document.getElementById("cap").textContent="Couldn't load today's calls. Refresh to try again.";return}
    var s=document.createElement("script");s.src="slates/day-"+n+".js?v="+n;
    s.onload=function(){var P=(window.YTR_SLATES||{})[n];if(P&&P.length)startGame(n,P);else tryDay(n-1,left-1)};
    s.onerror=function(){tryDay(n-1,left-1)};document.head.appendChild(s)}
  var qs=new URLSearchParams(location.search),q=+qs.get("day"),l=document.createElement("script");
  function go(){var latest=window.YTR_LATEST||todayN();tryDay(q>0?Math.min(q,latest):Math.max(1,Math.min(todayN(),latest)),30)}
  l.src="slates/latest.js?v="+Math.floor(Date.now()/6e5);l.onload=go;l.onerror=go;document.head.appendChild(l);
})();
</script>
</body>
</html>
