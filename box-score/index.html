<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Score Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../quiz.css">
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="logo">Box Score Detective</div><div class="sub" id="sub">Today's set</div></div>
    <div class="dots" id="dots" aria-label="Progress"></div>
  </header>
  <main id="play">
    <div class="clock"><h1 id="rt"></h1><p id="rn"></p></div>
    <div id="top"></div>
    <p class="cap" id="cap" aria-live="polite"></p>
    <div class="picks" id="body"></div>
    <div class="verdict" id="verdict" hidden>
      <h2 id="vh"></h2><p class="fact" id="fact"></p><p id="why"></p>
      <p><a id="src" target="_blank" rel="noopener"></a></p>
      <button class="primary" id="next"></button>
    </div>
  </main>
  <main id="done" hidden>
    <div class="verdict">
      <div class="sub" id="rank"></div>
      <div class="big"><span id="score">0</span><small>/6</small></div>
      <div class="grid" id="grid" aria-hidden="true"></div>
      <p class="muted" id="streak"></p>
      <ul class="rows" id="rows"></ul>
      <button class="primary" id="copy">Copy my score</button>
      <button class="ghost" id="review">Play these again</button>
      <p class="muted" style="margin:12px 0 0">Every stat line is from a real game and is linked on each one. Not affiliated with any league or team.</p>
    </div>
  </main>
  <p class="more"><a href="../">All games</a></p>
</div>
<script src="../quiz.js"></script>
<script>
Quiz.start({ name: "Box Score Detective", slates: "BX_SLATES", latest: "BX_LATEST", key: "bx_daily", epoch: [2026, 11, 20],
  ranks: ["Never saw the game", "Casual fan", "Stat sheet reader", "Stat sheet reader", "Beat writer", "Beat writer", "Lead detective"],
  good: "Case closed", bad: "Wrong suspect", next: "Next case",
  head: function (r) { return [r.sport + " · " + r.year, r.clue] },
  ask: function (r) { return r.q },
  build: function (r, body, pick, el) {
    var top = document.getElementById("top"), g = el("div", "line"); top.textContent = "";
    r.line.forEach(function (x) { var d = el("div"); d.appendChild(el("b", "", x[1])); d.appendChild(el("span", "", x[0])); g.appendChild(d) }); top.appendChild(g);
    r.options.forEach(function (o, j) { var b = el("button", "pick opt"), t = el("div", "tag"); t.appendChild(el("span", "", o)); t.appendChild(el("small", "", "")); b.appendChild(t); b.onclick = function () { pick(j) }; body.appendChild(b) }) },
  reveal: function (r, j, body) {
    [].forEach.call(body.children, function (b, n) { b.disabled = true; b.querySelector(".tag small").textContent = n === r.answer ? "Correct" : (n === j ? "Your pick" : "");
      b.classList.add(n === r.answer ? "best" : (n === j ? "miss" : "dim")) }) },
  result: function (r, ok) { return ok ? "That's the one: " + r.options[r.answer] + "." : "It was " + r.options[r.answer] + "." },
  row: function (r) { return [r.sport + " " + r.year, r.options[r.answer]] } });
</script>
</body>
</html>
