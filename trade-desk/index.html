<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../quiz.css">
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="logo">Trade Desk</div><div class="sub" id="sub">Today's set</div></div>
    <div class="dots" id="dots" aria-label="Progress"></div>
  </header>
  <main id="play">
    <div class="clock"><h1 id="rt"></h1><p id="rn"></p></div>
    <div id="top"></div>
    <p class="cap" id="cap" aria-live="polite"></p>
    <div class="picks" id="body"></div>
    <div class="verdict" id="verdict" hidden>
      <h2 id="vh"></h2><p class="fact" id="fact"></p><p id="why"></p>
      <p><a id="src" target="_blank" rel="noopener"></a></p>
      <button class="primary" id="next"></button>
    </div>
  </main>
  <main id="done" hidden>
    <div class="verdict">
      <div class="sub" id="rank"></div>
      <div class="big"><span id="score">0</span><small>/6</small></div>
      <div class="grid" id="grid" aria-hidden="true"></div>
      <p class="muted" id="streak"></p>
      <ul class="rows" id="rows"></ul>
      <button class="primary" id="copy">Copy my score</button>
      <button class="ghost" id="review">Play these again</button>
      <p class="muted" style="margin:12px 0 0">Every trade is real and the details are linked on each one. The winner is the side that got more out of the deal, judged years later. Not affiliated with any league or team.</p>
    </div>
  </main>
  <p class="more"><a href="../">All games</a></p>
</div>
<script src="../quiz.js"></script>
<script>
Quiz.start({ name: "Trade Desk", slates: "TD_SLATES", latest: "TD_LATEST", key: "td_daily", epoch: [2026, 11, 20],
  ranks: ["Fleeced every time", "Fleeced", "Assistant GM", "Assistant GM", "Shrewd dealer", "Shrewd dealer", "Executive of the year"],
  good: "You won the trade", bad: "You got fleeced", next: "Next trade",
  head: function (r) { return [r.sport + " trade · " + r.year, r.note] },
  ask: function () { return "Years later, which team won this trade?" },
  build: function (r, body, pick, el) {
    r.sides.forEach(function (s, j) { var b = el("button", "pick"), t = el("div", "tag"); t.appendChild(el("span", "", "Team " + "AB"[j])); t.appendChild(el("small", "", "")); b.appendChild(t);
      b.appendChild(el("p", "lead", "Gets")); var ul = el("ul"); s.gets.forEach(function (x) { ul.appendChild(el("li", "", x)) }); b.appendChild(ul); b.onclick = function () { pick(j) }; body.appendChild(b) }) },
  reveal: function (r, j, body, el) {
    [].forEach.call(body.children, function (b, n) { var s = r.sides[n]; b.disabled = true; b.querySelector(".tag span").textContent = s.team;
      b.querySelector(".tag small").textContent = n === r.answer ? "Won the trade" : (n === j ? "Your pick" : "");
      b.classList.add(n === r.answer ? "best" : (n === j ? "miss" : "dim")); b.appendChild(el("p", "after", s.after)) }) },
  result: function (r, ok, j) { return "You sided with the " + r.sides[j].team + "." },
  row: function (r) { return [r.sport + " " + r.year, r.sides[r.answer].team] } });
</script>
</body>
</html>
