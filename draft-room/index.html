<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--night:#0d1712;--panel:#14221a;--line:#2a4234;--chalk:#f3f5ef;--muted:#9fb0a5;--yellow:#f4c430;--red:#e0453f;--green:#2fa866;--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:Barlow,system-ui,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--night);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.45}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:10px}
  .logo{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase;color:var(--yellow)}
  .sub{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .dots{display:flex;gap:6px}
  .dot{font-family:var(--display);font-weight:800;font-size:14px;min-width:26px;text-align:center;padding:4px 7px;border-radius:7px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
  .dot.now{border-color:var(--yellow);color:var(--chalk)} .dot.ok{background:var(--green);border-color:var(--green);color:#fff} .dot.no{background:var(--red);border-color:var(--red);color:#fff}
  .clock{padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
  .clock h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;margin:0 0 4px;text-transform:uppercase}
  .clock p{margin:0;color:var(--muted)}
  .cap{margin:12px 2px 10px;font-size:18px;font-weight:600;color:var(--yellow)}
  .picks{display:grid;gap:10px}
  button{font:inherit;color:inherit;cursor:pointer;border:0}
  .pick{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--panel);border:2px solid var(--line)}
  .pick:hover:not(:disabled){border-color:var(--yellow)} .pick:active:not(:disabled){transform:scale(.99)}
  .pick:focus-visible,.primary:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .pick:disabled{cursor:default}
  .pick .tag{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:.5px;text-transform:uppercase;line-height:1.1}
  .pick .tag small{font-size:15px;letter-spacing:.5px;color:var(--muted);font-weight:700;white-space:nowrap}
  .pick ul{list-style:none;margin:7px 0 0;padding:0;font-size:15px}
  .pick li{padding:2px 0}
  .pick .where{margin:4px 0 0;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.4px;text-transform:uppercase;color:var(--yellow)}
  .pick .career{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:15px;font-weight:600}
  .pick.best{border-color:var(--green)} .pick.best .tag small{color:var(--green)}
  .pick.miss{border-color:var(--red)} .pick.miss .tag small{color:var(--red)}
  .pick.dim{opacity:.72}
  .verdict{margin-top:12px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
  .verdict h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:0 0 6px;text-transform:uppercase}
  .verdict p{margin:0 0 8px}
  .verdict a,.more a{color:var(--yellow);font-weight:600;text-underline-offset:3px}
  .primary{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.6px;text-transform:uppercase;background:var(--yellow);color:#1a1606;border-radius:12px;padding:13px 18px;width:100%;margin-top:6px}
  .big{font-family:var(--display);font-weight:800;font-size:84px;line-height:.9;font-variant-numeric:tabular-nums}
  .big small{font-size:36px;color:var(--muted)}
  .grid{font-size:30px;letter-spacing:4px;margin:10px 0}
  .muted{color:var(--muted);font-size:14px}
  .rows{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
  .rows li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;background:var(--night);border:1px solid var(--line);font-size:15px}
  .rows b{font-family:var(--display);font-size:17px;letter-spacing:.4px;text-transform:uppercase}
  .ghost{width:100%;margin-top:8px;text-align:center;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;padding:12px;border-radius:12px;background:var(--panel);border:2px solid var(--line)}
  .more{display:block;text-align:center;margin:18px 0 0;color:var(--muted);font-size:14px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="logo">Draft Room</div><div class="sub" id="sub">Today's picks</div></div>
    <div class="dots" id="dots" aria-label="Progress"></div>
  </header>
  <main id="play">
    <div class="clock"><h1 id="rt"></h1><p id="rn"></p></div>
    <p class="cap" id="cap" aria-live="polite"></p>
    <div class="picks" id="picks"></div>
    <div class="verdict" id="verdict" hidden>
      <h2 id="vh"></h2><p id="why"></p>
      <p><a id="src" target="_blank" rel="noopener"></a></p>
      <button class="primary" id="next">Next pick</button>
    </div>
  </main>
  <main id="done" hidden>
    <div class="verdict">
      <div class="sub" id="rank"></div>
      <div class="big"><span id="score">0</span><small>/6</small></div>
      <div class="grid" id="grid" aria-hidden="true"></div>
      <p class="muted" id="streak"></p>
      <ul class="rows" id="rows"></ul>
      <button class="primary" id="copy">Copy my score</button>
      <button class="ghost" id="review">Play these again</button>
      <p class="muted" style="margin:12px 0 0">Pre-draft numbers and career stats come from public records and are linked on each pick. "Best pick" means the best NFL career so far. Not affiliated with any league or team.</p>
    </div>
  </main>
  <p class="more"><a href="../">All games</a> · <a href="../youre-the-ref/">You're the Ref</a> · <a href="../call-the-play/">Call the Play</a></p>
</div>
<script>
function startGame(DAY,R){
  "use strict";
  var $=function(i){return document.getElementById(i)},i=0,res=[],answered=false,L=["A","B","C"];
  function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
  function dots(){$("dots").textContent="";R.forEach(function(r,j){$("dots").appendChild(el("span","dot "+(res[j]===undefined?(j===i?"now":""):(res[j]?"ok":"no")),String(j+1)))})}
  function load(){answered=false;var r=R[i];$("verdict").hidden=true;$("sub").textContent="Day "+DAY+"  ·  Pick "+(i+1)+" of "+R.length;
    $("rt").textContent=r.year+" Draft · "+r.pos;$("rn").textContent=r.note;$("cap").textContent="You're on the clock. Who do you take?";
    var box=$("picks");box.textContent="";
    r.prospects.forEach(function(p,j){var b=el("button","pick"),t=el("div","tag");t.appendChild(el("span","","Prospect "+L[j]));t.appendChild(el("small","",""));b.appendChild(t);
      var ul=el("ul");p.pre.forEach(function(x){ul.appendChild(el("li","",x))});b.appendChild(ul);b.onclick=function(){answer(j)};box.appendChild(b)});
    dots()}
  function answer(j){if(answered)return;answered=true;var r=R[i],ok=j===r.answer;res[i]=ok;
    [].forEach.call($("picks").children,function(b,n){var p=r.prospects[n];b.disabled=true;
      b.querySelector(".tag span").textContent=p.name;
      b.querySelector(".tag small").textContent=n===r.answer?"Best career":(n===j?"Your pick":"");
      b.classList.add(n===r.answer?"best":(n===j?"miss":"dim"));
      b.insertBefore(el("p","where",p.school+" · "+p.pick),b.querySelector("ul"));
      b.appendChild(el("p","career","NFL career: "+p.career))});
    $("cap").textContent=ok?"You took "+r.prospects[j].name+".":"You took "+r.prospects[j].name+". The pick was "+r.prospects[r.answer].name+".";
    $("vh").textContent=ok?"Great pick":"Draft bust";$("vh").style.color=ok?"var(--green)":"var(--red)";
    $("why").textContent=r.why;$("src").href=r.src.url;$("src").textContent="Source: "+r.src.label+" ↗";
    $("next").textContent=i===R.length-1?"See my score":"Next pick";$("verdict").hidden=false;dots();$("next").focus({preventScroll:true})}
  function grid(){return res.map(function(x){return x?"🟩":"🟥"}).join("")}
  function finish(){var n=res.filter(Boolean).length,ranks=["Fired on draft night","Intern","Area scout","Area scout","Scouting director","Scouting director","General manager"];
    $("play").hidden=true;$("done").hidden=false;$("sub").textContent="Day "+DAY+"  ·  Final";$("score").textContent=n;$("rank").textContent=ranks[n];$("grid").textContent=grid();
    $("rows").textContent="";R.forEach(function(r,j){var li=el("li"),a=el("span");a.appendChild(el("b","",r.year+" "+r.pos));li.appendChild(a);li.appendChild(el("span","",r.prospects[r.answer].name+" "+(res[j]?"✓":"✗")));$("rows").appendChild(li)});
    var s=store("dr_daily")||{};if(s.last!==DAY){s.streak=(s.last===DAY-1?(s.streak||0):0)+1;s.last=DAY;s.first=n}s.best=Math.max(s.best||0,n);store("dr_daily",s);
    $("streak").textContent=s.streak?"Streak: "+s.streak+" day"+(s.streak>1?"s":"")+"  ·  Best: "+s.best+"/"+R.length:"";dots()}
  $("next").onclick=function(){if(i===R.length-1){finish();return}i++;load();window.scrollTo({top:0})};
  $("review").onclick=function(){i=0;res=[];$("done").hidden=true;$("play").hidden=false;load()};
  $("copy").onclick=function(){var t="Draft Room · Day "+DAY+"\n"+grid()+"  "+res.filter(Boolean).length+"/"+R.length,b=this;
    function ok(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy my score"},1600)}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,function(){b.textContent=t});else b.textContent=t};
  window.__dr={answer:answer,next:function(){$("next").click()}};
  load();
}
(function(){
  /* Day 1 was 20 Nov 2026 (US Eastern). A new slate goes live at midnight Eastern if slates/day-N.js exists; otherwise the latest one stays up. */
  function todayN(){try{var s=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()).split("-");
    return 1+Math.round((Date.UTC(+s[0],+s[1]-1,+s[2])-Date.UTC(2026,10,20))/864e5)}catch(e){return 1}}
  function tryDay(n,left){if(n<1||left<0){document.getElementById("cap").textContent="Couldn't load today's picks. Refresh to try again.";return}
    var s=document.createElement("script");s.src="slates/day-"+n+".js?v="+n;
    s.onload=function(){var R=(window.DR_SLATES||{})[n];if(R&&R.length)startGame(n,R);else tryDay(n-1,left-1)};
    s.onerror=function(){tryDay(n-1,left-1)};document.head.appendChild(s)}
  var q=+new URLSearchParams(location.search).get("day"),l=document.createElement("script");
  function go(){var latest=window.DR_LATEST||todayN();tryDay(q>0?Math.min(q,latest):Math.max(1,Math.min(todayN(),latest)),30)}
  l.src="slates/latest.js?v="+Math.floor(Date.now()/6e5);l.onload=go;l.onerror=go;document.head.appendChild(l);
})();
</script>
</body>
</html>
